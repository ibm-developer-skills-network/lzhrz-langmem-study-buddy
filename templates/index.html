<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LangMem Study Buddy</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sidebar-bg: #0D0A2E;
    --sidebar-text: #A89FD8;
    --sidebar-active-bg: rgba(99,82,222,0.22);
    --sidebar-active-text: #EDE9FF;
    --sidebar-active-border: #6352DE;
    --primary: #4F46E5;
    --primary-light: #EEF2FF;
    --primary-mid: #C7D2FE;
    --chat-bg: #F6F5FF;
    --surface: #FFFFFF;
    --text: #111827;
    --text-muted: #6B7280;
    --border: #E5E7EB;
    --user-msg: #4F46E5;
    --user-msg-text: #FFFFFF;
    --tool-search: #0891B2;
    --tool-save: #059669;
    --step-dot: #374151;
    --tag-bg: rgba(99,82,222,0.12);
    --tag-text: #4338CA;
    --warn-bg: #FEF9C3;
    --warn-text: #92400E;
    --error-bg: #FEE2E2;
    --error-text: #991B1B;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--chat-bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Layout ──────────────────────────────────────────────────────────── */
  .app {
    display: grid;
    grid-template-columns: 1fr 280px;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Main chat area ──────────────────────────────────────────────────── */
  .chat-main {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    border-left: 1px solid rgba(0,0,0,0.06);
    border-right: 1px solid rgba(0,0,0,0.06);
  }

  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .chat-header-left h1 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.2;
  }
  .header-actions { display: flex; gap: 8px; }

  .btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.1s;
    white-space: nowrap;
  }
  .btn:hover { background: #F3F4F6; }
  .btn.btn-primary {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .btn.btn-primary:hover { background: #4338CA; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* alert banner */
  .alert {
    padding: 10px 20px;
    font-size: 13px;
    flex-shrink: 0;
  }
  .alert-warn { background: var(--warn-bg); color: var(--warn-text); }
  .alert-error { background: var(--error-bg); color: var(--error-text); }

  /* ── Messages ────────────────────────────────────────────────────────── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg-row {
    display: flex;
    gap: 10px;
    animation: fadeUp 0.2s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .msg-row.user .msg-avatar   { background: var(--user-msg);  color: white; }
  .msg-row.assistant .msg-avatar { background: var(--primary-light); color: var(--primary); }

  .msg-body { max-width: 72%; display: flex; flex-direction: column; gap: 4px; }
  .msg-row.user .msg-body { align-items: flex-end; }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-row.user .msg-bubble {
    background: var(--user-msg);
    color: var(--user-msg-text);
    border-bottom-right-radius: 4px;
  }
  .msg-row.assistant .msg-bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .tool-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 2px;
  }
  .tool-chip {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
  }
  .chip-search { background: #E0F2FE; color: var(--tool-search); }
  .chip-save   { background: #D1FAE5; color: var(--tool-save); }
  .chip-other  { background: #F3F4F6; color: var(--text-muted); }

  /* typing indicator */
  .typing-row { opacity: 0.7; }
  .typing-dots { display: flex; gap: 4px; padding: 12px 14px; }
  .typing-dot {
    width: 7px; height: 7px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
    40%           { transform: scale(1);   opacity: 1;   }
  }

  /* ── Input bar ───────────────────────────────────────────────────────── */
  .input-bar {
    padding: 14px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  #msg-input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.15s;
  }
  #msg-input:focus { border-color: var(--primary); }
  #msg-input::placeholder { color: var(--text-muted); }

  /* ── Right panel: memory inspector ──────────────────────────────────── */
  .memory-panel {
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .memory-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .memory-header h3 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .memory-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
  }

  .mem-section {
    padding: 0 16px 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }
  .mem-section:last-child { border-bottom: none; }

  .mem-section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .mem-count {
    font-size: 11px;
    background: var(--primary-light);
    color: var(--primary);
    border-radius: 8px;
    padding: 0 6px;
    font-weight: 600;
  }

  .profile-grid {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .profile-row {
    display: flex;
    gap: 6px;
    font-size: 12px;
  }
  .profile-key { color: var(--text-muted); min-width: 90px; }
  .profile-val { color: var(--text); font-weight: 500; }

  .mem-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .mem-item {
    font-size: 12px;
    background: #F9F8FF;
    border: 1px solid #EDE9FE;
    border-radius: 6px;
    padding: 6px 9px;
    color: var(--text);
    line-height: 1.4;
  }
  .ep-item { background: #ECFDF5; border-color: #A7F3D0; }
  .ep-topic { font-weight: 600; font-size: 11px; color: #065F46; margin-bottom: 2px; }
  .ep-action { font-size: 11px; color: #374151; }

  .system-prompt-box {
    font-size: 11px;
    font-family: "SF Mono", "Fira Code", monospace;
    background: #F9F8FF;
    border: 1px solid #EDE9FE;
    border-radius: 6px;
    padding: 8px;
    color: var(--text);
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-wrap;
    max-height: 140px;
    overflow-y: auto;
  }

  .optimize-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    align-items: center;
  }
  .optimize-row select {
    font-size: 12px;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    flex: 1;
  }

  .empty-state {
    font-size: 12px;
    color: var(--text-muted);
    font-style: italic;
  }

  /* scrollbar styling */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }
</style>
</head>
<body>
<div class="app">

  <!-- ── Center: chat ────────────────────────────────────────────────── -->
  <main class="chat-main">
    <header class="chat-header">
      <div class="chat-header-left">
        <h1>Study Buddy</h1>
      </div>
      <div class="header-actions">
        <button class="btn" onclick="newConversation()">New conversation</button>
      </div>
    </header>

    <div id="alert-bar" style="display:none" class="alert"></div>

    <div class="messages" id="messages">
      <div class="msg-row assistant">
        <div class="msg-avatar">AI</div>
        <div class="msg-body">
          <div class="msg-bubble">
            Hi! I'm your study buddy. What would you like to learn today?
          </div>
        </div>
      </div>
    </div>

    <div class="input-bar">
      <textarea id="msg-input" placeholder="Ask me anything…" rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="btn btn-primary" id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </main>

  <!-- ── Right: memory inspector ────────────────────────────────────── -->
  <aside class="memory-panel">
    <div class="memory-header">
      <h3>Memory inspector</h3>
    </div>
    <div class="memory-body" id="memory-body">
      <div class="mem-section">
        <div class="mem-section-title">Profile</div>
        <div id="profile-content" class="empty-state">No profile yet</div>
      </div>
      <div class="mem-section" id="facts-section">
        <div class="mem-section-title">
          Facts <span class="mem-count" id="facts-count">0</span>
        </div>
        <div id="facts-content" class="empty-state">No facts stored</div>
      </div>
      <div class="mem-section" id="episodes-section">
        <div class="mem-section-title">
          Episodes <span class="mem-count" id="episodes-count">0</span>
        </div>
        <div id="episodes-content" class="empty-state">No episodes yet</div>
      </div>
      <div class="mem-section" id="prompt-section">
        <div class="mem-section-title">System prompt</div>
        <div id="prompt-content" class="system-prompt-box"></div>
      </div>
    </div>
  </aside>

</div>

<script>
let sending = false;

async function init() {
  const res = await fetch("/status");
  const data = await res.json();
  updateMemory(data.memory);
}

function showAlert(msg, type) {
  const el = document.getElementById("alert-bar");
  el.textContent = msg;
  el.className = "alert alert-" + type;
  el.style.display = "block";
}

async function sendMessage() {
  if (sending) return;
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  autoResize(input);
  appendMessage("user", text);
  showTyping();
  setSending(true);

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text}),
    });
    const data = await res.json();
    hideTyping();
    setSending(false);

    if (data.error) {
      appendMessage("assistant", "Error: " + data.error, []);
    } else {
      appendMessage("assistant", data.reply, data.tool_calls || []);
      updateMemory(data.memory);
    }
  } catch (e) {
    hideTyping();
    setSending(false);
    appendMessage("assistant", "Network error — is the server running?");
  }
}

function appendMessage(role, text, toolCalls) {
  const container = document.getElementById("messages");
  const row = document.createElement("div");
  row.className = "msg-row " + role;

  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  avatar.textContent = role === "user" ? "You" : "AI";

  const body = document.createElement("div");
  body.className = "msg-body";

  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  bubble.textContent = text;
  body.appendChild(bubble);

  if (toolCalls && toolCalls.length > 0) {
    const chips = document.createElement("div");
    chips.className = "tool-chips";
    toolCalls.forEach(tc => {
      const chip = document.createElement("span");
      const isSearch = tc.tool && tc.tool.includes("search");
      chip.className = "tool-chip " + (isSearch ? "chip-search" : "chip-save");
      chip.textContent = isSearch ? "searched memory" : "saved to memory";
      chips.appendChild(chip);
    });
    body.appendChild(chips);
  }

  row.appendChild(avatar);
  row.appendChild(body);
  container.appendChild(row);
  container.scrollTop = container.scrollHeight;
}

let typingEl = null;
function showTyping() {
  const container = document.getElementById("messages");
  typingEl = document.createElement("div");
  typingEl.className = "msg-row assistant typing-row";
  typingEl.innerHTML = `
    <div class="msg-avatar">AI</div>
    <div class="msg-body">
      <div class="msg-bubble" style="padding:0">
        <div class="typing-dots">
          <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
        </div>
      </div>
    </div>`;
  container.appendChild(typingEl);
  container.scrollTop = container.scrollHeight;
}
function hideTyping() {
  if (typingEl) { typingEl.remove(); typingEl = null; }
}

function clearMessages() {
  const container = document.getElementById("messages");
  container.innerHTML = "";
}

function setSending(val) {
  sending = val;
  document.getElementById("send-btn").disabled = val;
  document.getElementById("msg-input").disabled = val;
}

async function newConversation() {
  const res = await fetch("/reset", {method: "POST"});
  const data = await res.json();
  clearMessages();
  appendMessage("assistant", "Starting a new conversation.");
  updateMemory(data.memory);
}

function updateMemory(mem) {
  if (!mem) return;

  const profile = mem.profile || {};
  const profileEl = document.getElementById("profile-content");
  const profileKeys = Object.entries(profile).filter(([, v]) => v && (Array.isArray(v) ? v.length : true));
  if (profileKeys.length) {
    profileEl.className = "profile-grid";
    profileEl.innerHTML = profileKeys.map(([k, v]) =>
      `<div class="profile-row"><span class="profile-key">${k}</span><span class="profile-val">${Array.isArray(v) ? v.join(", ") : v}</span></div>`
    ).join("");
  } else {
    profileEl.className = "empty-state";
    profileEl.textContent = "No profile yet";
  }

  const facts = mem.facts || [];
  document.getElementById("facts-count").textContent = facts.length;
  const factsEl = document.getElementById("facts-content");
  if (facts.length) {
    factsEl.className = "mem-list";
    factsEl.innerHTML = facts.slice(0, 8).map(f =>
      `<div class="mem-item">${typeof f === "object" ? JSON.stringify(f).slice(0,80) : String(f).slice(0,80)}</div>`
    ).join("");
  } else {
    factsEl.className = "empty-state";
    factsEl.textContent = "No facts stored yet";
  }

  const episodes = mem.episodes || [];
  document.getElementById("episodes-count").textContent = episodes.length;
  const epsEl = document.getElementById("episodes-content");
  if (episodes.length) {
    epsEl.className = "mem-list";
    epsEl.innerHTML = episodes.map(e =>
      `<div class="mem-item ep-item"><div class="ep-topic">${e.topic}</div><div class="ep-action">${e.action}</div></div>`
    ).join("");
  } else {
    epsEl.className = "empty-state";
    epsEl.textContent = "No episodes yet";
  }

  document.getElementById("prompt-content").textContent = mem.system_prompt || "";
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}

init();
</script>
</body>
</html>
